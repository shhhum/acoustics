[project]
name = "soundroom"
version = "0.1.0"
description = "Sound-room-in-a-venue acoustical simulator: TMM/JCA wall model + FEM room solver"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "scikit-fem>=10.0",
  "pydantic>=2.8",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "matplotlib>=3.9",
]

[project.scripts]
soundroom = "soundroom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soundroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
